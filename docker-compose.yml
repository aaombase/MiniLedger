# Optional: Postgres for people who do not have a local install.
# Creates the dev database. For the test database run:
#   docker compose exec db createdb -U miniledger miniledger_test
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger_dev
      POSTGRES_DB: miniledger
    ports:
      - "5432:5432"
    volumes:
      - miniledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniledger -d miniledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  miniledger-pgdata:
